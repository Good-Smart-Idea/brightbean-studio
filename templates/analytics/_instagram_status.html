{% if account.platform == "instagram" %}
<div id="instagram-analytics-{{ account.id }}"
     {% if account.platform in analytics_enabled_platforms and account.analytics_status == "checking" %}
     hx-get="{% url 'analytics:status' workspace_id=workspace_id account_id=account.id %}"
     hx-trigger="every 3s" hx-swap="outerHTML"
     {% endif %}>
    {% if account.platform in analytics_enabled_platforms and account.instagram_analytics_message %}
    <div class="mt-3 px-3 py-2 bg-amber-50 border border-amber-200 rounded-lg" role="status">
        <p class="text-xs text-amber-800"><strong>Instagram analytics.</strong> {{ account.instagram_analytics_message }}</p>
        {% if account.analytics_needs_reconnect %}
        <form method="post" action="{% url 'social_accounts:reconnect' workspace_id=workspace_id account_id=account.id %}" class="mt-2">
            {% csrf_token %}
            <button type="submit" class="px-3 py-1.5 text-xs font-semibold text-amber-800 bg-amber-100 rounded-full">Reconnect for analytics</button>
        </form>
        {% endif %}
    </div>
    {% endif %}
</div>
{% endif %}
